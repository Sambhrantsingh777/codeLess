name: Build, Test, and Release codeLess

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: codeless-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cross-platform:
    name: Build & Run Headless Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Real PTY, git and file-system tests must pass on every shipped platform, not only Windows.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build solution
        run: dotnet build codeLess.sln -c Release --nologo

      - name: Run Avalonia Headless Test Suite
        run: dotnet test tests/codeLess.Avalonia.Tests/codeLess.Avalonia.Tests.csproj -c Release --no-build --nologo --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Report failed tests as annotations
        if: failure()
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Path TestResults -Filter *.trx -Recurse | Select-Object -First 1
          if (-not $trx) { Write-Output "::error title=No test results::test host may have crashed before writing results"; exit 0 }
          [xml]$x = Get-Content $trx.FullName
          $failed = $x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -ne 'Passed' -and $_.outcome -ne 'NotExecuted' }
          foreach ($f in $failed) {
            $msg = ($f.Output.ErrorInfo.Message + ' | ' + ($f.Output.ErrorInfo.StackTrace -split "`n" | Select-Object -First 3) -join ' ')
            if ($msg.Length -gt 900) { $msg = $msg.Substring(0, 900) }
            $msg = $msg -replace "`r", '' -replace "`n", ' '
            Write-Output "::error title=FAILED $($f.testName)::$msg"
          }
          Write-Output "$(@($failed).Count) failed test(s)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  build-and-sign-windows:
    name: Build & Sign Windows Native IDE
    runs-on: windows-latest
    needs: test-cross-platform
    permissions:
      contents: write
    env:
      HAS_SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile codeLess.Core.dll and codeLess.exe with .NET Framework csc.exe
        shell: pwsh
        run: ./Compile.ps1 -SkipInstaller

      - name: Launch smoke test of the WinForms UI (open workspace + files, paint every control)
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "winforms-smoke.txt"
          $p = Start-Process -FilePath ".\codeLess.exe" -ArgumentList @("--smoke-test", "`"$report`"", "`"$PWD`"") -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "codeLess.exe smoke test timed out" }
          if (Test-Path $report) { Get-Content $report }
          $crash = Join-Path $env:APPDATA "codeLess\crash.log"
          if (Test-Path $crash) { Write-Host "--- crash.log ---"; Get-Content $crash -Tail 80 }
          if ($p.ExitCode -ne 0) { throw "codeLess.exe smoke test failed with exit code $($p.ExitCode)" }

      - name: Upload unsigned codeLess.exe artifact for SignPath origin verification
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        id: upload-unsigned-exe
        with:
          name: codeLess-unsigned-exe
          path: codeLess.exe

      - name: Sign codeLess.exe with SignPath
        if: github.event_name != 'pull_request' && env.HAS_SIGNPATH_TOKEN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe

      - name: Replace codeLess.exe with signed executable and verify
        if: github.event_name != 'pull_request' && env.HAS_SIGNPATH_TOKEN == 'true'
        shell: pwsh
        run: |
          Copy-Item "signed-exe\codeLess.exe" "codeLess.exe" -Force
          $sig = Get-AuthenticodeSignature -FilePath "codeLess.exe"
          if ($sig.Status -ne "Valid") {
              throw "Authenticode signature on codeLess.exe is not Valid: $($sig.Status)"
          }

      - name: Setup .NET 8 SDK (for WiX MSI Builder)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Inno Setup Installer (codeLess-Setup.exe) and WiX MSI (codeLess-Setup.msi)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
              choco install innosetup --no-progress -y
          }
          & $iscc /Q Installer.iss
          if (-not (Test-Path "Output\codeLess-Setup.exe")) {
              throw "Inno Setup failed to produce Output\codeLess-Setup.exe"
          }
          dotnet tool install --global wix --version 5.0.2
          $wixExe = Join-Path $env:USERPROFILE ".dotnet\tools\wix.exe"
          & $wixExe build Installer.wxs -arch x64 -o "Output\codeLess-Setup.msi"
          if (-not (Test-Path "Output\codeLess-Setup.msi")) {
              throw "WiX failed to produce Output\codeLess-Setup.msi"
          }

      - name: Upload unsigned codeLess-Setup.exe artifact for SignPath origin verification
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        id: upload-unsigned-setup
        with:
          name: codeLess-unsigned-setup
          path: Output/codeLess-Setup.exe

      - name: Sign codeLess-Setup.exe with SignPath
        if: github.event_name != 'pull_request' && env.HAS_SIGNPATH_TOKEN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Verify signed installer and prepare release output
        if: github.event_name != 'pull_request' && env.HAS_SIGNPATH_TOKEN == 'true'
        shell: pwsh
        run: |
          Copy-Item "signed-setup\codeLess-Setup.exe" "Output\codeLess-Setup.exe" -Force
          $sig = Get-AuthenticodeSignature -FilePath "Output\codeLess-Setup.exe"
          if ($sig.Status -ne "Valid") {
              throw "Authenticode signature on Output\codeLess-Setup.exe is not Valid: $($sig.Status)"
          }

      - name: Publish final Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codeLess-Windows
          path: |
            codeLess.exe
            Output/codeLess-Setup.exe
            Output/codeLess-Setup.msi

  build-macos:
    name: Build & Smoke-Test macOS (Apple Silicon arm64 & Intel x64)
    runs-on: macos-latest
    timeout-minutes: 60
    needs: test-cross-platform
    env:
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Avalonia Headless Tests natively on macOS
        run: dotnet test tests/codeLess.Avalonia.Tests/codeLess.Avalonia.Tests.csproj -c Release --nologo

      - name: Import Apple Developer ID certificate (optional)
        if: github.event_name != 'pull_request' && env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/codeless-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "MACOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          if [[ -n "$APPLE_API_KEY_P8_BASE64" ]]; then
            echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Build macOS .app, .zip, and .dmg (arm64 + x64)
        env:
          MACOS_SIGN_IDENTITY: ${{ (github.event_name != 'pull_request' && env.HAS_MACOS_CERT == 'true') && vars.MACOS_SIGN_IDENTITY || '-' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          chmod +x ./build-mac.sh
          if ! ./build-mac.sh both > /tmp/macbuild.log 2>&1; then
            cat /tmp/macbuild.log
            echo "::error::macOS build failed: $(tail -n 8 /tmp/macbuild.log | tr '\r\n' '  ')"
            exit 1
          fi
          cat /tmp/macbuild.log

      - name: Verify DMG Mount, Strict Codesign & Live macOS App Launch Smoke Test
        run: |
          codesign --verify --deep --strict --verbose=2 dist/macos-arm64/codeLess.app
          codesign --verify --deep --strict --verbose=2 dist/macos-x64/codeLess.app
          plutil -lint dist/macos-arm64/codeLess.app/Contents/Info.plist
          plutil -lint dist/macos-x64/codeLess.app/Contents/Info.plist
          file dist/macos-arm64/codeLess.app/Contents/MacOS/codeLess | grep -i "arm64"
          file dist/macos-x64/codeLess.app/Contents/MacOS/codeLess | grep -i "x86_64"
          MOUNT_DIR="$(mktemp -d)"
          hdiutil attach dist/codeLess-mac-arm64.dmg -mountpoint "$MOUNT_DIR" -nobrowse -readonly
          test -x "$MOUNT_DIR/codeLess.app/Contents/MacOS/codeLess"
          test -L "$MOUNT_DIR/Applications"
          hdiutil detach "$MOUNT_DIR"
          ./dist/macos-arm64/codeLess.app/Contents/MacOS/codeLess --screenshot ./dist/mac-launch-smoke.png < /dev/null
          # When notarized, Gatekeeper must accept the app and DMG exactly as an end user's Mac would.
          if xcrun stapler validate dist/macos-arm64/codeLess.app >/dev/null 2>&1; then
            spctl --assess --type execute --verbose=4 dist/macos-arm64/codeLess.app
            spctl --assess --type execute --verbose=4 dist/macos-x64/codeLess.app
            spctl --assess --type open --context context:primary-signature --verbose=4 dist/codeLess-mac-arm64.dmg
          else
            echo "::warning::macOS build is ad-hoc signed (not notarized). Gatekeeper will warn users until Apple Developer ID secrets are configured (see docs/SIGNING.md)."
          fi
          security delete-keychain "$RUNNER_TEMP/codeless-signing.keychain-db" 2>/dev/null || true

      - name: Publish macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codeLess-macOS
          path: |
            dist/codeLess-mac-arm64.dmg
            dist/codeLess-mac-x64.dmg
            dist/codeLess-mac-arm64.zip
            dist/codeLess-mac-x64.zip

  build-linux:
    name: Build Linux Native Packages (x64 & arm64 .deb + .tar.gz)
    runs-on: ubuntu-latest
    needs: test-cross-platform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Avalonia Headless Tests natively on Linux
        run: dotnet test tests/codeLess.Avalonia.Tests/codeLess.Avalonia.Tests.csproj -c Release --nologo

      - name: Build Linux x64 & arm64 Debian (.deb) and Portable (.tar.gz) Packages
        run: |
          chmod +x ./cross-platform/build-linux.sh
          ./cross-platform/build-linux.sh linux-x64
          ./cross-platform/build-linux.sh linux-arm64

      - name: Publish Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codeLess-Linux
          path: |
            Output/codeLess-linux-x64.deb
            Output/codeLess-linux-x64.tar.gz
            Output/codeLess-linux-arm64.deb
            Output/codeLess-linux-arm64.tar.gz

  publish-release:
    name: Publish GitHub Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-and-sign-windows, build-macos, build-linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # Sigstore keyless signing (OIDC identity of this workflow)
      attestations: write  # GitHub artifact attestations (SLSA build provenance)
    env:
      HAS_GPG_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout repository (release notes)
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-stage

      - name: Flatten release binaries & generate SHA256SUMS.txt
        run: |
          mkdir -p release-files
          find release-stage/codeLess-Windows -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} release-files/ \;
          find release-stage/codeLess-macOS -type f \( -name "*.dmg" -o -name "*.zip" \) -exec cp {} release-files/ \;
          find release-stage/codeLess-Linux -type f \( -name "*.deb" -o -name "*.tar.gz" \) -exec cp {} release-files/ \;
          cd release-files
          sha256sum * > SHA256SUMS.txt
          ls -lh

      # Provenance for every platform's binaries: signed via Sigstore with this workflow's identity, recorded in the
      # public transparency log. Users verify with: gh attestation verify <file> --repo ${{ github.repository }}
      - name: Attest build provenance for all release binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-files/*.exe
            release-files/*.msi
            release-files/*.dmg
            release-files/*.zip
            release-files/*.deb
            release-files/*.tar.gz

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless Sigstore signature over the checksum file (covers every asset through its SHA-256).
      - name: Sign SHA256SUMS.txt with Sigstore (keyless)
        run: |
          cosign sign-blob --yes --bundle release-files/SHA256SUMS.txt.sigstore.json release-files/SHA256SUMS.txt
          cosign verify-blob --bundle release-files/SHA256SUMS.txt.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release-files/SHA256SUMS.txt

      # Optional detached OpenPGP signatures (Linux packaging convention). Enabled by adding the repository secrets
      # RELEASE_GPG_PRIVATE_KEY (ASCII-armored) and RELEASE_GPG_PASSPHRASE.
      - name: GPG-sign release files (optional)
        if: env.HAS_GPG_KEY == 'true'
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          cd release-files
          for f in *; do
            case "$f" in *.asc|*.sigstore.json) continue;; esac
            gpg --batch --yes --pinentry-mode loopback --passphrase "$RELEASE_GPG_PASSPHRASE" --armor --detach-sign "$f"
          done
          gpg --armor --export > codeLess-release-signing-key.asc
          rm -rf "$GNUPGHOME"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: release-files/*
